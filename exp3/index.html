<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>🛍️ Mini Shopping Store</h1>

        <p>Shop your favourite products!</p>

    </header>

    <main>

        <section class="products">

            <h2>Our Products</h2>

            <div class="product">

                <h3>Headphones</h3>

                <p>Price: ₹999</p>

                <button onclick="addToCart('Headphones', 999)">

                    Add to Cart

                </button>

            </div>

            <div class="product">

                <h3>Smart Watch</h3>

                <p>Price: ₹1499</p>

                <button onclick="addToCart('Smart Watch', 1499)">

                    Add to Cart

                </button>

            </div>

            <div class="product">

                <h3>Backpack</h3>

                <p>Price: ₹799</p>

                <button onclick="addToCart('Backpack', 799)">

                    Add to Cart

                </button>

            </div>

        </section>

        <section class="cart">

            <h2>🛒 Your Cart</h2>

            <ul id="cart-items"></ul>

            <h3>Total: ₹<span id="total">0</span></h3>

            <button onclick="clearCart()">Clear Cart</button>

        </section>

    </main>

    <script src="script.js"></script>
</script>
</html>
